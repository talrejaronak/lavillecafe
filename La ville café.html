<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ville Cafe — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#24150F;        /* Dark Espresso — main text */
    --ink-soft:#765F54;   /* Warm Gray — secondary text */
    --cream:#FFF8EE;      /* Warm Cream — main background */
    --panel:#FFFFFF;      /* White — cards */
    --olive:#6B3E26;      /* Coffee Brown — secondary brand */
    --olive-deep:#3B2116; /* Deep Espresso — primary brand */
    --line:#EDE0CF;       /* light divider, tuned for warm cream */
    --rule: rgba(36,21,15,0.14);
    --addcart:#5A2E1B;    /* Add to Cart button */
    --checkout-cta:#B9782C; /* Checkout / Payment button */
    --gold:#C58B45;       /* Caramel Gold accent */
    --success:#28734A;
    --error:#A33A3A;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
  }
  /* ---------- HERO ---------- */
  .hero{
    padding:52px 24px 34px;
    text-align:center;
    position:relative;
    overflow:hidden;
    background:var(--olive-deep);
    color:var(--cream);
    animation:heroIn 0.9s ease both;
  }
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(59,33,22,0.97),rgba(59,33,22,0.55)),url("https://cdn.21st.dev/assets/mirror/a1/a1faddabc2da5d4216759258797329cac7e26bf3e204f9205cf79f4fb6c090db.jpg") center/cover;opacity:0.72;transform:scale(1.04);animation:heroPhotoIn 1.2s ease both;}
  .hero > *{position:relative;z-index:2;}
  .hero-photo{width:76px;height:76px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,248,238,0.5);margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,0.2);}
  @keyframes heroPhotoIn{from{opacity:0;transform:scale(1.12);}to{opacity:0.72;transform:scale(1.04);}}
  .hero-cta{display:inline-flex;gap:8px;align-items:center;margin-top:20px;padding:10px 16px;border:1px solid rgba(255,248,238,0.5);border-radius:999px;color:var(--cream);font-size:0.78rem;font-weight:700;text-decoration:none;transition:background 0.25s ease,transform 0.25s ease;}
  .hero-cta:hover{background:rgba(255,248,238,0.14);transform:translateY(-2px);}
  .hero-3d{position:absolute;right:7%;top:22%;width:110px;height:110px;z-index:1;pointer-events:none;transform-style:preserve-3d;animation:heroCupFloat 6s ease-in-out infinite;}
  .hero-3d::before{content:"";position:absolute;inset:20px 12px 14px;border-radius:12px 12px 28px 28px;background:linear-gradient(110deg,#f7e8d3,#bd7b3f 58%,#63341e);box-shadow:inset -12px -10px 14px rgba(39,17,8,.32),0 20px 24px rgba(20,8,3,.25);transform:rotateX(13deg) rotateY(-18deg);}
  .hero-3d::after{content:"";position:absolute;left:2px;right:2px;bottom:4px;height:22px;border-radius:50%;background:radial-gradient(ellipse at 45% 35%,#6e351e 0 36%,#35180f 38% 56%,#e3b37d 58% 66%,transparent 68%);transform:rotateX(62deg);filter:drop-shadow(0 8px 6px rgba(20,8,3,.3));}
  @keyframes heroCupFloat{0%,100%{transform:translate3d(0,0,0) rotate(-4deg);}50%{transform:translate3d(0,-12px,10px) rotate(5deg);}}
  .coffee-spill{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden;opacity:0;visibility:hidden;}
  .coffee-spill::before{content:"";position:absolute;left:83%;top:-12vh;width:6vw;min-width:42px;max-width:76px;height:112vh;background:linear-gradient(90deg,transparent 0 12%,#4b2112 22% 74%,transparent 88%);border-radius:50%;transform:translateX(-50%) rotate(4deg) scaleY(.05);transform-origin:top;filter:blur(.2px);}
  .coffee-spill::after{content:"";position:absolute;left:83%;top:0;width:42vw;height:20vh;min-height:100px;background:radial-gradient(ellipse at center,#8e4925 0 34%,#5a2816 48%,transparent 70%);transform:translate(-50%,-75%) scale(.4);filter:blur(1px);}
  .coffee-spill.active{opacity:1;visibility:visible;}
  .coffee-spill.active::before{animation:coffeePour .72s cubic-bezier(.55,.06,.68,.19) forwards;}
  .coffee-spill.active::after{animation:coffeeSplash .72s cubic-bezier(.2,.8,.3,1) .35s forwards;}
  @keyframes coffeePour{0%{transform:translateX(-50%) scaleY(.05);}58%{transform:translateX(-50%) scaleY(1);}100%{transform:translateX(-50%) scaleY(1);opacity:.9;}}
  @keyframes coffeeSplash{0%{transform:translate(-50%,-75%) scale(.4);}70%{transform:translate(-50%,2%) scale(1.05);}100%{transform:translate(-50%,5%) scale(1.2);opacity:0;}}
  @media(prefers-reduced-motion:reduce){.coffee-spill{display:none;}}
  .category-transition{position:fixed;inset:0;z-index:90;pointer-events:none;display:grid;place-items:center;opacity:0;visibility:hidden;background:rgba(59,33,22,.08);}
  .category-transition span{font-size:4.5rem;filter:drop-shadow(0 18px 16px rgba(59,33,22,.28));transform:translate3d(-42vw,18vh,0) rotate(-28deg) scale(.55);}
  .category-transition.active{opacity:1;visibility:visible;}
  .category-transition.active span{animation:categoryFoodSweep .7s cubic-bezier(.18,.75,.25,1) forwards;}
  @keyframes categoryFoodSweep{0%{transform:translate3d(-42vw,18vh,0) rotate(-28deg) scale(.55);opacity:0;}18%{opacity:1;}72%{transform:translate3d(8vw,-3vh,0) rotate(18deg) scale(1.12);opacity:1;}100%{transform:translate3d(44vw,-18vh,0) rotate(36deg) scale(.72);opacity:0;}}
  @media(prefers-reduced-motion:reduce){.category-transition{display:none;}}
  .card{transform-style:preserve-3d;perspective:900px;}
  .card-media{transform:translateZ(0);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s ease;}
  @media (hover:hover){.card:hover .card-media{transform:translateZ(12px) rotateX(2deg);box-shadow:0 18px 22px rgba(59,33,22,.16);}.card:hover .card-body{transform:translateZ(6px);}.card-body{transition:transform .45s ease;}}
  .section-3d-divider{height:110px;margin:12px auto 0;max-width:980px;position:relative;overflow:hidden;pointer-events:none;}
  .section-3d-divider::before{content:"";position:absolute;left:10%;right:10%;top:52%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 12px 24px rgba(185,120,44,.2);}
  .section-3d-divider::after{content:"";position:absolute;left:50%;top:30%;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6d49c,#9b5729 55%,#3b2116 57%);box-shadow:14px 8px 0 -5px #c58b45,-18px 14px 0 -7px #6b3e26;transform:translateX(-50%) rotateX(52deg) rotateZ(20deg);animation:dividerDrift 5s ease-in-out infinite;}
  @keyframes dividerDrift{50%{transform:translate(-50%,-8px) rotateX(52deg) rotateZ(200deg);}}
  @keyframes heroIn{
    from{opacity:0; transform:translateY(-8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .hero svg{width:46px;height:46px;margin-bottom:14px;opacity:0.9;}
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:2.5rem;
    letter-spacing:0.01em;
    margin:0 0 6px;
  }
  .hero p{
    margin:0;
    font-size:0.85rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#c9c3ac;
  }

  /* ---------- NAV ---------- */
  .nav-wrap{
    position:sticky; top:0; z-index:20;
    background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 16px;
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav-btn{
    flex:0 0 auto;
    font-size:0.78rem;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--olive-deep);
    background:var(--panel);
    border:1px solid var(--line);
    padding:7px 14px;
    border-radius:999px;
    white-space:nowrap;
    font-family:'Manrope',sans-serif;
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .nav-btn.active{background:var(--olive-deep); color:var(--cream); border-color:var(--olive-deep);}

  /* ---------- MAIN ---------- */
  main{max-width:520px; margin:0 auto; padding:8px 20px 60px;}

  section{padding-top:36px; scroll-margin-top:64px;}

  .cat-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:4px;
  }
  .cat-head svg{width:22px;height:22px; color:var(--olive); flex:0 0 auto;}
  .cat-head h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.5rem;
    margin:0;
  }
  .cat-sub{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin:2px 0 16px 32px;
  }

  .item{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:10px 0;
    border-bottom:1px solid var(--rule);
  }
  .item:last-child{border-bottom:none;}
  .item-name{
    font-size:0.98rem;
    font-weight:500;
  }
  .item-leader{
    flex:1;
    border-bottom:1px dotted var(--line);
    margin-bottom:5px;
    min-width:12px;
  }
  .item-price{
    font-family:'Fraunces',serif;
    font-size:1rem;
    font-weight:500;
    color:var(--olive-deep);
    white-space:nowrap;
  }
  .item-note{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .addon{
    margin-top:10px;
    padding:10px 12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:0.82rem;
    color:var(--ink-soft);
  }
  .addon strong{color:var(--ink); font-weight:600;}

  footer{
    text-align:center;
    padding:34px 20px 46px;
    color:var(--ink-soft);
    font-size:0.82rem;
  }
  footer .name{
    font-family:'Fraunces',serif;
    color:var(--ink);
    font-size:1.05rem;
    margin-bottom:6px;
  }
  footer a{color:var(--olive-deep); text-decoration:none; font-weight:600;}

  @media (prefers-reduced-motion: reduce){
    .hero{animation:none;}
  }

  .about-strip{
    background:var(--olive-deep);
    padding:0 24px 22px;
    text-align:center;
  }
  .about-text{
    color:#e9d9c8;
    font-size:0.85rem;
    line-height:1.5;
    max-width:480px;
    margin:0 auto 12px;
  }
  .about-meta{
    display:flex; flex-wrap:wrap; justify-content:center; gap:14px;
    font-size:0.78rem;
  }
  .about-meta span{color:var(--gold); font-weight:600;}
  .about-meta a{color:#e9d9c8; text-decoration:underline; text-underline-offset:2px;}

  .gallery-wrap{background:var(--olive-deep); padding:0 0 22px;}
  .gallery{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:0 20px;
    scrollbar-width:none;
  }
  .gallery::-webkit-scrollbar{display:none;}
  .gallery img{
    flex:0 0 auto;
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:12px;
    margin-top:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card-media{
    position:relative;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg, var(--olive-deep), var(--olive));
    overflow:hidden;
  }
  .fly-clone::after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,0.5),transparent 32%,transparent 68%,rgba(36,21,15,0.22));opacity:0.7;mix-blend-mode:screen;}
  .fly-clone.food-shape-pizza{border-radius:50%;clip-path:circle(48% at 50% 50%);}
  .fly-clone.food-shape-pasta{border-radius:42%;clip-path:ellipse(45% 48% at 50% 50%);}
  .fly-clone.food-shape-burger{border-radius:28% 28% 42% 42%;clip-path:inset(8% 3% 8% 3% round 24%);}
  .fly-clone.food-shape-fries{border-radius:34% 34% 46% 46%;clip-path:ellipse(42% 48% at 50% 50%);}
  .fly-clone.food-shape-drink{border-radius:24% 24% 42% 42%;clip-path:inset(5% 12% 4% 12% round 24%);}
  .fly-clone.food-shape-default{border-radius:42%;clip-path:ellipse(45% 48% at 50% 50%);}
  .money-flight{position:fixed;z-index:210;pointer-events:none;padding:9px 14px;border:1px solid rgba(255,248,238,.7);border-radius:999px;background:linear-gradient(135deg,#fff8ee 0%,#f0c47d 58%,#c58b45 100%);color:#3b2116;font-size:.82rem;font-weight:800;white-space:nowrap;box-shadow:0 12px 28px rgba(59,33,22,.3),0 0 0 5px rgba(240,196,125,.16);will-change:transform,opacity;}
  .money-flight::first-letter{font-size:1rem;}
  @keyframes moneyPop{0%{opacity:0;transform:translate3d(0,0,0) scale(.55) rotate(-5deg);}14%{opacity:1;transform:translate3d(0,-14px,0) scale(1.04) rotate(-2deg);}48%{opacity:1;transform:translate3d(var(--money-mid-x),var(--money-mid-y),0) scale(.9) rotate(2deg);}78%{opacity:.84;transform:translate3d(var(--money-near-x),var(--money-near-y),0) scale(.68) rotate(4deg);}100%{opacity:.08;transform:translate3d(var(--money-x),var(--money-y),0) scale(.42) rotate(6deg);}}
  .money-flight.fly{animation:moneyPop 1.5s cubic-bezier(.22,.72,.28,1) forwards;}
  .item-modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:rgba(36,21,15,.52);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;}
  .item-modal.open{opacity:1;visibility:visible;}
  .item-modal-card{position:relative;width:min(440px,100%);overflow:hidden;border:1px solid rgba(255,248,238,.55);border-radius:22px;background:var(--cream);box-shadow:0 24px 70px rgba(36,21,15,.3);transform:translateY(18px) scale(.96);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .item-modal.open .item-modal-card{transform:translateY(0) scale(1);}
  .item-modal-image{height:240px;background:var(--olive-deep) center/cover;}
  .item-modal-body{padding:20px;}.item-modal-body h3{margin:0;color:var(--olive-deep);font:500 1.65rem 'Fraunces',serif;}.item-modal-body p{margin:8px 0 16px;color:var(--ink-soft);font-size:.82rem;line-height:1.55;}.item-modal-price{display:inline-block;padding:6px 11px;border-radius:999px;background:#f5e4cd;color:var(--olive-deep);font:500 1rem 'Fraunces',serif;}.item-modal-add{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--addcart);color:#fff;font:700 .86rem 'Manrope',sans-serif;cursor:pointer;}.item-modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border:1px solid rgba(255,248,238,.7);border-radius:50%;background:rgba(59,33,22,.72);color:#fff;font-size:1.25rem;line-height:1;cursor:pointer;}
  @media(prefers-reduced-motion:reduce){.item-modal,.item-modal-card{transition:none;}}
  .card-media svg{width:28px;height:28px;color:#f2efe4; position:relative; z-index:1;}
  .card-media img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    z-index:2;
    transition:transform 0.45s cubic-bezier(.2,.7,.2,1), opacity 0.3s ease;
  }
  .card-media.is-fallback::after{content:"Fresh from the cafe";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;color:#fff8ee;font-family:'Fraunces',serif;font-size:0.85rem;text-align:center;background:radial-gradient(circle at 50% 38%,rgba(197,139,69,0.72),transparent 34%),linear-gradient(135deg,var(--olive-deep),var(--olive));z-index:1;}
  .veg-dot{
    position:absolute;
    top:8px; right:8px;
    width:14px;height:14px;
    border-radius:4px;
    background:#fff;
    border:1px solid #2e7d32;
    display:flex;align-items:center;justify-content:center;
  }
  .veg-dot::after{
    content:"";
    width:7px;height:7px;
    border-radius:50%;
    background:#2e7d32;
  }
  .card-body{padding:10px 11px 12px;}
  .card-name{
    font-size:0.82rem;
    font-weight:600;
    line-height:1.28;
    min-height:2.1em;
  }
  .card-price{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:0.92rem;
    color:var(--olive);
    margin-top:6px;
  }
  @keyframes justAddedPulse{
    0%{transform:scale(1);}
    35%{transform:scale(1.035);}
    100%{transform:scale(1);}
  }
  .card.just-added{animation:justAddedPulse 0.4s ease;}
  .card.just-added .card-media{box-shadow:inset 0 0 0 3px var(--gold);}
  .card.just-added .card-media img{filter:saturate(1.18) contrast(1.04);}

  .food-badge{
    position:absolute; top:8px; left:8px;
    font-size:0.62rem; font-weight:700;
    padding:3px 7px; border-radius:6px;
    color:#fff; z-index:3;
    letter-spacing:0.01em;
  }
  .food-badge.bestseller{background:var(--gold); color:var(--ink);}
  .food-badge.popular{background:var(--olive-deep);}
  .food-badge.new{background:var(--success);}

  /* ---------- CART ---------- */
  .card-action{margin-top:8px;}
  .add-btn{
    background:var(--addcart);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:0.76rem;
    font-weight:700;
    letter-spacing:0.02em;
    padding:7px 14px;
  }
  .add-btn:active{transform:scale(0.94);}
  .qty-control{
    display:flex; align-items:center; gap:10px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px 10px;
    width:fit-content;
  }
  .qty-control button{
    background:none; border:none;
    font-size:1rem; font-weight:700;
    color:var(--olive-deep);
    line-height:1;
    padding:0 2px;
  }
  .qty-control span{font-weight:700; font-size:0.85rem; min-width:14px; text-align:center;}

  .cart-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    transform:translateY(140%);
    background:var(--olive-deep);
    color:#fff;
    border:none;
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 -8px 24px rgba(0,0,0,0.18);
    z-index:40;
    transition:transform 0.3s cubic-bezier(0.2,0.8,0.2,1);
    font-family:'Manrope',sans-serif;
  }
  .cart-bar.visible{transform:translateY(0);}
  .cart-bar-count{font-weight:700; font-size:0.88rem;}
  .cart-bar-total{font-weight:800; font-size:0.95rem;}
  .cart-bar-view{
    font-weight:700; font-size:0.85rem;
    color:var(--gold);
    letter-spacing:0.02em;
  }
  .cart-toast{position:fixed;right:20px;bottom:76px;z-index:45;display:flex;align-items:center;gap:12px;max-width:340px;padding:11px 12px 11px 14px;border:1px solid rgba(255,248,238,.24);border-radius:14px;background:rgba(59,33,22,.96);color:#fff8ee;box-shadow:0 14px 34px rgba(36,21,15,.25);opacity:0;transform:translateY(16px) scale(.96);pointer-events:none;transition:opacity .28s ease,transform .28s cubic-bezier(.2,.8,.2,1);}
  .cart-toast.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .cart-toast-icon{width:38px;height:38px;flex:0 0 auto;border-radius:9px;background-position:center;background-size:cover;box-shadow:0 4px 10px rgba(0,0,0,.2);}
  .cart-toast-copy{min-width:0;font-size:.76rem;line-height:1.35;}.cart-toast-copy strong{display:block;color:#f0c47d;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;}.cart-toast-copy span{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cart-toast-action{border:0;border-left:1px solid rgba(255,248,238,.2);padding:5px 0 5px 12px;background:none;color:#f0c47d;font-size:.72rem;font-weight:700;white-space:nowrap;cursor:pointer;}
  @media(max-width:520px){.cart-toast{left:14px;right:14px;bottom:70px;max-width:none;}.cart-toast-action{margin-left:auto;}}
  .clear-cart-btn{display:block;width:100%;margin:10px 0 0;padding:8px;border:1px solid rgba(163,58,58,.3);border-radius:8px;background:transparent;color:var(--error);font:600 .75rem 'Manrope',sans-serif;cursor:pointer;transition:background .2s ease,color .2s ease;}
  .clear-cart-btn:hover{background:#fff0ed;color:#7e2424;}

  .cart-overlay{
    position:fixed; inset:0;
    background:rgb
